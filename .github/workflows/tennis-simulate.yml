# Manual test messages.
#
# Run this from the Actions tab whenever you want to see what the bot looks like without
# waiting for a real match: choose what to simulate from the dropdown and press the
# button. No code to edit, no flags to remember.
#
# Every message it posts is banner-marked 🧪 TEST, uses a throwaway idempotency key, and
# changes no stored match state — so a drill can never be mistaken for real news, and
# can never suppress a real alert later.
#
# There is no `schedule:` here. It only ever runs when you ask it to.

name: Tennis simulation (manual test)

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'What to simulate'
        type: choice
        required: true
        default: live
        options:
          - live
          - delayed
          - cancelled
          - daily
          - weekly
          - monthly
      dry_run:
        description: 'Log the message instead of posting it to Slack'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: tennis-simulate
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Simulate ${{ inputs.what }}
        run: npm run bot:simulate -- "$SIMULATION_KIND"
        env:
          SIMULATION_KIND: ${{ inputs.what }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          STATE_API_URL: ${{ vars.STATE_API_URL }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
          TENNISTV_BASE_URL: ${{ vars.TENNISTV_BASE_URL }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
          TENNISTV_API_BASE_URL: ${{ vars.TENNISTV_API_BASE_URL }}
          TENNISTV_ACCOUNT_ID: ${{ vars.TENNISTV_ACCOUNT_ID }}
          MONITOR_SCHEDULE_SLIP_MINUTES: ${{ vars.MONITOR_SCHEDULE_SLIP_MINUTES }}
          STATE_RETENTION_DAYS: ${{ vars.STATE_RETENTION_DAYS }}
          RUN_TIMEOUT_SECONDS: ${{ vars.RUN_TIMEOUT_SECONDS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          SLACK_DRY_RUN: ${{ inputs.dry_run }}
          # TENNISTV_PROVIDER is deliberately NOT exposed as a repository variable.
          # Production must always read the real site; a stray "fixture" would make the
          # bot quietly report recorded data as though it were today's schedule.
