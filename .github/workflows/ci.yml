# Continuous integration.
#
# Deliberately offline: the suite uses recorded fixtures and in-memory fakes, so CI
# never depends on Tennis TV or Slack being up. The one test that does talk to the real
# Tennis TV is opt-in (`npm run test:contract`) and is not run here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-progress check of the same branch; there is nothing to
# preserve, unlike the production workflows.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Two projects: the Node application, and the Worker against the Workers runtime.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Proves the Worker still bundles for workerd, and that wrangler.jsonc is valid.
      - name: Build the Worker
        run: npm run worker:build
